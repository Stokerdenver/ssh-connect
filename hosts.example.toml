# SSH-Connect host inventory — example.
#
# Easiest: run `ssh-connect ui` and add hosts there. To edit by hand, copy this
# file to ~/.ssh-connect/hosts.toml (%USERPROFILE%\.ssh-connect\hosts.toml on
# Windows) or point SSHCONNECT_HOSTS at it. The current directory is never used.
#
# Each [[host]] block names a device the agent reaches by `name` alone:
# ssh_connect {host: "<name>"} or connect {name: "<name>"}. A saved host's
# address, port and protocol cannot be overridden by tool arguments.
#
# Hosts that already live in ~/.ssh/config need no entry here at all: both
# connect tools resolve a matching Host alias (HostName/User/Port/IdentityFile)
# and authenticate through ssh-agent.
#
# Secrets never go in this file: the UI stores them in the Windows Credential
# Manager. Env overrides also work — for "core-sw-01":
# SSHCONNECT_CORE_SW_01_PASSWORD (name upper-cased, non-alphanumerics -> "_").
#
# [settings]
# transfer_dir   = "C:/Users/you/ssh-connect-files"  # local folder for file tools
# host_key_check = "tofu"                            # or "off"

# SSH switch authenticated with a private key.
[[host]]
name     = "core-sw-01"
host     = "10.0.0.2"
protocol = "ssh"
port     = 22
username = "admin"
key_path = "C:/Users/you/.ssh/lab_ed25519"
# prompt = "core-sw-01#"        # optional explicit prompt regex

# SSH switch authenticated with a password (saved in the UI, not here).
[[host]]
name     = "edge-sw-02"
host     = "10.0.0.3"
protocol = "ssh"
username = "admin"

# Legacy device reachable only over Telnet.
[[host]]
name     = "old-access-07"
host     = "10.0.1.7"
protocol = "telnet"
port     = 23

# Console-cable access over a serial port.
[[host]]
name        = "console-a"
protocol    = "serial"
serial_port = "COM3"
baud        = 9600
